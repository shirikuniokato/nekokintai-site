<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Cloudflare Pages はこのファイルがあると、ないパスを 404 で返す（無いとトップを 200 で返し、検索に重複として載る） -->
<meta name="robots" content="noindex">
<title>ページがみつかりません | ねこ勤怠</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0C3A44; --bg:#EAF4F7; --muted:#7FA6AF; --deep:#155C69;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:"DotGothic16",system-ui,sans-serif;line-height:1.9;text-align:center;}
  main{padding:32px 16px;}
  img{display:block;margin:0 auto 20px;width:96px;height:auto;image-rendering:pixelated;}
  h1{font-size:20px;font-weight:400;margin:0;}
  p{margin:4px 0 0;color:var(--muted);font-size:14px;}
  a{color:var(--deep);text-decoration:none;}
  a:hover{color:var(--ink);}
  a:focus-visible{outline:2px solid var(--deep);outline-offset:3px;}
  nav{margin-top:24px;display:flex;gap:20px;justify-content:center;font-size:15px;}
</style>
</head>
<body>
<main>
  <img src="/assets/lp/cream-sit.png" alt="" width="192" height="120">
  <h1>ページがみつかりませんでした</h1>
  <p lang="en">Page not found</p>
  <nav>
    <a href="/">トップへもどる</a>
    <a href="/en/" lang="en">Home (English)</a>
  </nav>
</main>
</body>
</html>
