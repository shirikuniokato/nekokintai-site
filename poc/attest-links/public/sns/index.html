<body>
<h1>リンクの試験（SNS・#261）</h1>
<p class="note">ひとつ押したら、アプリの画面か開いたページを記録してから、この画面にもどって次を押してください。</p>

<h2>押すもの</h2>
<!-- コードはどれも POC259。試作アプリ（poc/attest-links）は POC259 のときだけ expectedCode:true を出すので、値が欠けずに届いたかを確かめられる -->
<a class="button" id="link-a" href="https://go-dev.nekokintai.com/neko?code=POC259">(a) https の go-dev（本番で使う形）</a>
<a class="button" id="link-a2" href="https://go-dev.nekokintai.com/neko?code=POC259&amp;openExternalBrowser=1">(a′) (a) に openExternalBrowser=1 を付けたもの（LINE 用）</a>
<a class="button" id="link-b" href="nekokintaidev://neko?code=POC259">(b) カスタムスキーム nekokintaidev://（止まるかを見るだけ）</a>
<a class="button" id="link-c" href="intent://neko?code=POC259#Intent;scheme=nekokintaidev;package=com.ccya.nekokintai.dev;S.browser_fallback_url=https%3A%2F%2Fnekokintai-attest-poc.pages.dev%2Fneko%3Fcode%3DPOC259%26fallback%3Dintent;end">(c) intent://（Android だけ）</a>

<h2>このブラウザの UA</h2>
<textarea id="ua" rows="6" readonly></textarea>
<p>見つかった目印（推測）: <span id="tokens">-</span></p>

<h2>開いている URL</h2>
<textarea id="href" rows="3" readonly></textarea>

<script>
  // UA をそのまま見せる。目印は案内の文の判定に使えるかを見るための推測で、行き先は分けない
  var ua = navigator.userAgent
  document.getElementById('ua').value = ua
  document.getElementById('href').value = location.href
  var marks = ['Line/', 'Instagram', 'FBAN', 'FBAV', 'FB_IAB', 'Twitter', 'X/', '; wv)', 'CriOS', 'Safari/', 'Chrome/']
  var found = marks.filter(function (mark) { return ua.indexOf(mark) !== -1 })
  document.getElementById('tokens').textContent = found.length ? found.join(' / ') : 'なし'
</script>
</body>
