name: Notify shared cat reports

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: neko-report-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: vars.NEKOS_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEKOS_SLACK_WEBHOOK_URL: ${{ secrets.NEKOS_SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure production target
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/neko-target.json`, JSON.stringify({
            environment: 'production', accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            databaseId: '444a3dec-05aa-4be0-8b5e-0d2c60da518a', databaseName: 'nekokintai-nekos'
          }));
          JS
      - name: Deliver pending notifications
        run: node scripts/neko-notifications.mjs production "$RUNNER_TEMP/neko-target.json" apply
