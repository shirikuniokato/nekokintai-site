name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ブラウザテスト（言語ボタンの切替）は Playwright の Chromium で動く
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check translations
        run: npm run check:i18n

      - name: Test store update automation
        run: npm test

      - name: Test locale switching in a browser
        run: npm run test:browser

      - name: Build production assets and test Functions boundary
        run: npm run test:api

      - name: Deploy production site
        working-directory: cloudflare/production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../node_modules/wrangler/bin/wrangler.js pages deploy ../../.pages-dist/site --project-name=nekokintai --branch=main --commit-hash=${{ github.sha }}

      - name: Deploy legacy redirect
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare/legacy-redirect --project-name=nekokintai-legacy --branch=main --commit-hash=${{ github.sha }}
